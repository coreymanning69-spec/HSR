[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hollow-star-reliquary"
version = "0.2.2"
description = "Local Hollow Star game engine and presentation adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["pygame-ce>=2.5,<3"]
test = ["pytest>=8,<9"]
antigravity = ["google-antigravity>=0.1,<0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hollowstar*"]
