<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo={schema:'hollow-star-public-view-1',room:{name:'The Town Above the Well',apparent_function:'A town at the threshold of the Reliquary.',visible_tells:['The well is the route toward the deeper floors.']},party:[{id:'p0',name:'Design adventurer',hp:32,max_hp:40,armor_class:16,equipment:[{name:'Training sword',slot:'Weapon'},{name:'Travel coat',slot:'Armor'}]},{id:'p1',name:'Design companion',hp:26,max_hp:30,armor_class:14,equipment:[]}],opposition:[],progression:{hsr_rank:1,rank_xp:0,gold:24,platinum:0,rooms_cleared:0},inventory:[{name:'Unidentified Rune',kind:'imprint',identified:false,slot:'Unrevealed',description:'Identify through the host to reveal its properties.'}],available_actions:[{id:'investigate',label:'Investigate'},{id:'inspect',label:'Inspect'},{id:'rest',label:'Rest'},{id:'exit',label:'Leave'}],recent_receipts:[]};
const S={screen:'room',view:demo,selected:'p0',live:false,busy:false,runId:null,note:'DESIGN FIXTURE · illustrative state only; no run state is written.',receipt:null,battle:false,artRole:'adventurer',weapon:'sword',options:null,roll:null,preview:null,createStep:'edit',draft:{name:'',identity:'',creation_seed:'',race:'human',character_class:'warrior',background:'veteran',level:1,roll_set:0,ability_assignment:'auto',floating_bonuses:'auto',advancements:'auto',advancement_mode:'auto',skills:'auto',skill_mode:'auto',spells:'auto',spell_mode:'auto',spell_budget:0}};
const tabs=[['room','◇','Room'],['battle','⚔','Battle'],['equipment','♜','Equipment'],['roster','♙','Roster'],['journal','▤','Journal'],['map','◎','Floors'],['create','✧','Create'],['options','☷','Options']];
function avatar(role='adventurer',weapon='sword'){return `<div class="avatar ${esc(role)}" aria-label="Illustrative ${esc(role)} silhouette with ${esc(weapon)}"><i class="boots"></i><i class="boot-lines"></i><i class="coat"></i><i class="seam"></i><i class="hem"></i><i class="cuffs"></i><i class="head"></i><i class="hair"></i><i class="fringe"></i><i class="eyes"></i><i class="face-line"></i><i class="collar"></i><i class="belt"></i><i class="buckle"></i>${weapon==='sword'?'<i class="blade"></i><i class="grip"></i><i class="guard"></i>':weapon==='staff'?'<i class="staff-item"></i>':weapon==='bow'?'<i class="bow-item"></i>':weapon==='shield'?'<i class="shield-item"></i>':''}</div>`}
function artControls(){return `<div class="art-options"><label>Role study<select id="art-role">${['adventurer','guard','caster','townsfolk'].map(v=>`<option ${v===S.artRole?'selected':''}>${v}</option>`).join('')}</select></label><label>Held-object study<select id="art-weapon">${['sword','staff','bow','shield','none'].map(v=>`<option ${v===S.weapon?'selected':''}>${v}</option>`).join('')}</select></label></div><small>Illustrative role study · not a named character or equipment change.</small>`}

function actor(){return S.view.party?.find(a=>a.id===S.selected)||S.view.party?.[0]||{name:'No actor',equipment:[]}}
function actors(){return (S.view.party||[]).map(a=>{const hp=Number(a.hp),max=Number(a.max_hp),pct=Number.isFinite(hp)&&max>0?Math.max(0,Math.min(100,hp/max*100)):0;return `<button class="actor ${a.id===actor().id?'active':''}" data-actor="${esc(a.id)}" aria-pressed="${a.id===actor().id}"><span class="portrait">${esc(a.name?.[0])}</span><span class="actor-info"><strong>${esc(a.name)}</strong><span class="meter"><i style="width:${pct}%"></i></span><small>${esc(a.hp)} / ${esc(a.max_hp)} HP · AC ${esc(a.armor_class)}</small></span></button>`}).join('')||'<p class="muted">No party is visible.</p>'}
function stats(){const p=S.view.progression||{};return `<div class="stats">${[['Rank',p.hsr_rank],['Gold',p.gold],['Platinum',p.platinum]].map(([k,v])=>`<div class="stat"><strong>${esc(v)}</strong><small>${k}</small></div>`).join('')}</div>`}
function stage(battle=false){return `<div class="stage ${battle?'battle-stage':''}"><div class="mountains"></div><div class="town"></div><div class="path"></div><div class="well"></div>${S.live?'<div class="scene-tag">'+esc(S.view.room?.name||'Current room')+'</div>':avatar(S.artRole,S.weapon)}${battle?'<div class="opponent-art">'+avatar('guard','shield')+'<small>Role study · source: ui-design-system.json</small></div>':''}<span class="scene-tag" style="top:auto;bottom:14px">${battle?'ENCOUNTER VIEW':'FLOOR ONE · DESIGN FIXTURE'}</span><span class="scene-caption">${S.live?'Decorative backdrop · not room geometry':'Illustrative scene · source: ui-design-system.json'}</span></div>`}
function actionButtons(){return (S.view.available_actions||[]).map((a,i)=>`<button data-action="${i}">${esc(a.label||a.id||a)}</button>`).join('')}
const CABILITIES=['STR','DEX','CON','INT','WIS','CHA'],CANAMES={STR:'Strength',DEX:'Dexterity',CON:'Constitution',INT:'Intelligence',WIS:'Wisdom',CHA:'Charisma'};
function copt(kind,id){return (S.options?.[kind]||[]).find(row=>row.id===id)||{}}
function cmod(value){const n=Number(value);if(!Number.isFinite(n))return '—';const m=Math.floor((n-10)/2);return (m>=0?'+':'')+m}
function cbonus(row){const bonuses=row?.bonuses||row||{};return CABILITIES.filter(a=>bonuses[a]).map(a=>CANAMES[a]+' '+(bonuses[a]>0?'+':'')+bonuses[a]).join(' · ')||'No ability score bonuses'}
function ctraits(row){return (row.traits||[]).map(x=>x.replaceAll('_',' ')).join(' · ')||'No listed traits'}
function cfield(label,key,type='text',required=false){return `<label>${esc(label)}<input data-create="${esc(key)}" name="${esc(key)}" type="${type}" value="${esc(S.draft[key]||'')}" ${required?'required':''}></label>`}
function cselect(label,key,rows){return `<label>${esc(label)}<select data-create="${esc(key)}" name="${esc(key)}">${rows.map(row=>`<option value="${esc(row.id)}" ${S.draft[key]===row.id?'selected':''}>${esc(row.name)}</option>`).join('')}</select></label>`}
function cauto(scores,cls){const order=[...(cls.primary||[]),...CABILITIES.filter(a=>!(cls.primary||[]).includes(a))],sorted=[...scores].sort((a,b)=>b-a);return Object.fromEntries(order.map((a,i)=>[a,sorted[i]]))}
function cbuild(){const d=S.draft;return {name:d.name,creation_seed:d.creation_seed||d.name,race:d.race,character_class:d.character_class,background:d.background,level:Number(d.level||1),roll_set:Number(d.roll_set||0),ability_assignment:d.ability_assignment&&typeof d.ability_assignment==='object'?d.ability_assignment:'auto',floating_bonuses:Array.isArray(d.floating_bonuses)?d.floating_bonuses:'auto',advancements:d.advancement_mode==='manual'?(d.advancements||{}):'auto',skills:d.skill_mode==='manual'?(d.skills||[]):'auto',spell_budget:Number(d.spell_budget||0),spells:d.spell_mode==='manual'?(d.spells||[]):'auto'}}
function cabilityRows(scores){const cls=copt('classes',S.draft.character_class),assignment=S.draft.ability_assignment==='auto'?cauto(scores,cls):(S.draft.ability_assignment||{});return `<div class="creation-abilities"><div class="creation-ability"><span class="creation-muted">Ability</span><span class="creation-muted">Score</span><span class="creation-muted">Modifier</span></div>${CABILITIES.map(a=>{const current=assignment[a]??'';return `<label class="creation-ability"><span><strong>${a}</strong><small>${CANAMES[a]}</small></span><select data-assign="${a}" aria-label="${CANAMES[a]} score"><option value="">Auto</option>${scores.map(score=>`<option value="${score}" ${String(current)===String(score)?'selected':''}>${score}</option>`).join('')}</select><strong>${current===''?'—':cmod(current)}</strong></label>`}).join('')}</div>`}
function cchecks(items,selected,attribute,withClass=false){return `<div class="creation-checks">${items.map(([label,meta])=>`<label class="creation-check ${withClass&&copt('classes',S.draft.character_class).skills?.includes(label)?'creation-class-skill':''}"><input type="checkbox" data-${attribute}="${esc(label)}" ${selected.includes(label)?'checked':''}><span>${esc(label)}<small>${esc(meta)}</small></span></label>`).join('')}</div>`}
function creationChoices(race,cls,bg){const floating=race.floating_bonus;return `<div class="creation-choice-grid"><section class="creation-section"><div class="eyebrow">Ancestry</div><h3>${esc(race.name)}</h3><p class="creation-bonus">${esc(cbonus(race))}</p><p class="creation-muted">${esc(ctraits(race))}</p><small>${esc(race.size||'—')} · ${esc(race.speed||'—')} ft${race.extra_skills?' · +1 trained skill':''}</small>${floating?`<p class="creation-points">Choose ${floating.count} non-Charisma abilities for +${floating.amount}.</p>`:''}</section><section class="creation-section"><div class="eyebrow">Class</div><h3>${esc(cls.name)}</h3><p class="creation-bonus">d${esc(cls.hit_die)} hit die · ${esc((cls.primary||[]).join(' / '))} primary</p><p class="creation-muted">${esc((cls.features||[]).join(' · '))}</p><small>Saving throws: ${esc((cls.saves||[]).join(' · '))} · class skills: ${esc((cls.skills||[]).join(' · '))}</small></section><section class="creation-section"><div class="eyebrow">Background</div><h3>${esc(bg.name)}</h3><p class="creation-bonus">${esc(CANAMES[bg.ability]||'')} +1</p><p class="creation-muted">Gold ${bg.gold?`${bg.gold.dice}d${bg.gold.sides}+${bg.gold.bonus}`:'—'}</p><small>${(bg.gear||[]).map(item=>esc(item.name)).join(' · ')||'No starting gear'}</small></section></div>`}
function creator(){if(!S.options)return `<section class="creation-shell"><div class="creation-copy"><div class="eyebrow">Character workshop</div><h2>Connect to begin</h2><p>Load the live race, class, background, bonus, and spell registry from the host before creating a lead.</p><div class="creation-actions"><button class="primary" data-create-action="load">Connect local engine</button><button data-screen="title">Back</button></div></div></section>`;if(S.createStep==='preview')return creationPreview();const d=S.draft,race=copt('races',d.race),cls=copt('classes',d.character_class),bg=copt('backgrounds',d.background),scores=S.roll?.scores||[],floating=race.floating_bonus,selectedFloating=Array.isArray(d.floating_bonuses)?d.floating_bonuses:[],manualSkills=d.skill_mode==='manual',manualSpells=d.spell_mode==='manual',selectedSkills=Array.isArray(d.skills)?d.skills:[],selectedSpells=Array.isArray(d.spells)?d.spells:[],level=Number(d.level||1),points=2*(S.options.advancement_levels||[]).filter(x=>level>=x).length;if(cls.spells?.length&&!d.spell_budget)d.spell_budget=level*5;const role=cls.id==='magician'||cls.id==='cleric'?'caster':cls.id==='warrior'?'guard':'adventurer';return `<section class="creation-shell"><div class="creation-hero"><div class="creation-copy"><div class="eyebrow">Character workshop · preview before save</div><h2>Shape your lead.</h2><p>Make a character that belongs in the Reliquary. Every selection below is passed to the existing HSRHost; the visual layer never rolls or resolves mechanics itself.</p><div class="creation-header-actions"><button data-create-action="load" class="secondary">Refresh registry</button><small>${esc(S.options.version||'registry loaded')} · ${esc(S.options.races.length)} ancestries · ${esc(S.options.classes.length)} classes</small></div></div><div class="creation-figure"><span class="creation-mark">Selected silhouette</span>${avatar(role,role==='guard'?'shield':role==='caster'?'staff':'sword')}</div></div><form id="creation-form" class="creation-form"><div class="creation-identity">${cfield('Lead name','name','text',true)}${cfield('Identity tag','identity')}${cfield('Creation seed','creation_seed')}</div><div class="creation-selects">${cselect('Ancestry','race',S.options.races)}${cselect('Class','character_class',S.options.classes)}${cselect('Background','background',S.options.backgrounds)}<label>Level<input data-create="level" name="level" type="number" min="1" max="20" value="${level}" required></label></div>${creationChoices(race,cls,bg)}${floating?`<section class="creation-section"><div class="eyebrow">Ancestry bonus choice</div><p>Choose ${floating.count} abilities for the floating +${floating.amount}. Selected ${selectedFloating.length}.</p>${cchecks(CABILITIES.filter(a=>!floating.exclude.includes(a)).map(a=>[a,CANAMES[a]]),selectedFloating,'floating')}</section>`:''}<section class="creation-section"><div class="eyebrow">Ability scores</div><div class="creation-roll"><div><h3>${scores.length?'Roll set '+(Number(S.roll.roll_set)+1):'Roll your ability scores'}</h3><p class="creation-muted">4d6, drop the lowest die. One optional full reroll.</p></div><button type="button" data-create-action="roll" class="secondary">${scores.length?(S.roll.roll_set===0?'Use one reroll':'Reroll used'):'Roll scores'}</button></div>${scores.length?`<div class="creation-rolls">${S.roll.rolls.map(row=>`<span><strong>${row.total}</strong><small>${row.dice.join(' · ')} · drop ${row.dropped}</small></span>`).join('')}</div>${cabilityRows(scores)}<p class="creation-muted">Leave assignments on Auto for class-priority placement, or select a rolled score for each ability.</p>`:'<p class="creation-muted">You can also preview from the seed without rolling here; the host will generate the deterministic receipt.</p>'}</section>${points?`<section class="creation-section"><div class="eyebrow">Advancement</div><p class="creation-points">Level ${level} grants ${points} ability points · priority ${cls.primary.join(' / ')}</p><div class="creation-actions"><button type="button" data-create-action="${d.advancement_mode==='manual'?'advancements-auto':'advancements-manual'}" class="secondary">${d.advancement_mode==='manual'?'Use automatic allocation':'Allocate manually'}</button></div>${d.advancement_mode==='manual'?cabilityRowsAdvancement(points):'<p class="creation-muted">The host allocates these points deterministically.</p>'}</section>`:''}<section class="creation-section"><div class="eyebrow">Skills</div><p class="creation-muted">Choose ${cls.skill_count+(race.extra_skills||0)} trained skills${manualSkills?' manually':' automatically'}.</p>${manualSkills?cchecks(Object.entries(S.options.skills||{}),selectedSkills,'skill',true):`<div class="creation-actions"><button type="button" data-create-action="skills-manual" class="secondary">Choose skills manually</button></div><small>Class skills: ${esc((cls.skills||[]).join(' · '))}${race.extra_skills?' · ancestry adds one':''}</small>`}</section>${cls.spells?.length?`<section class="creation-section"><div class="eyebrow">Spells</div><div class="creation-roll"><p class="creation-muted">Budget ${d.spell_budget||level*5} points · rank cap enforced by host.</p><input data-create="spell_budget" name="spell_budget" type="number" min="0" max="${level*5}" value="${d.spell_budget||level*5}" aria-label="Spell budget"></div>${manualSpells?cchecks((cls.spells||[]).map(spell=>[spell,spell.includes('@HSR')?'HSR signature':'5e spell']),selectedSpells,'spell'):`<div class="creation-actions"><button type="button" data-create-action="spells-manual" class="secondary">Choose spells manually</button></div><small>${cls.spells.length} class spells available; automatic selection stays deterministic.</small>`}</section>`:''}<div class="creation-actions"><button type="submit" class="primary">Preview complete character</button><button type="button" data-screen="title">Back</button><button type="button" data-create-action="restart">Restart</button></div></form></section>`}
function cabilityRowsAdvancement(points){const values=S.draft.advancements&&typeof S.draft.advancements==='object'?S.draft.advancements:{};return `<div class="creation-abilities">${CABILITIES.map(a=>`<label class="creation-ability"><span><strong>${a}</strong><small>${CANAMES[a]}</small></span><input type="number" min="0" max="${points}" data-advancement="${a}" value="${values[a]||0}"><strong>+${values[a]||0}</strong></label>`).join('')}</div>`}
function creationPreview(){const c=S.preview?.character||{};if(!c.profile||!c.build_hash)return `<section class="creation-shell"><div class="creation-copy"><h2>Preview unavailable</h2><p>The host did not return a complete character preview.</p><button data-create-action="edit">Edit draft</button></div></section>`;const p=c.profile,r=c.receipt||{},scores=p.ability_scores||{},skills=p.skill_bonuses||{},equipment=(p.equipment||[]).map(item=>item.display_name||item.name||item.id).filter(Boolean);return `<section class="creation-shell"><div class="creation-section"><div class="creation-preview-head"><div><div class="eyebrow">Final sheet · not saved</div><h2>${esc(p.name)}</h2><p>${esc(p.race)} ${esc(p.character_class)} · Level ${p.level} · ${esc(p.background?.name||'')}</p></div><span class="creation-points">${esc(c.build_hash.slice(0,12))}<br><small>BUILD HASH</small></span></div><p class="creation-muted">The preview is host-returned. Confirming creates the profile and a new DESIGN run; editing returns to this draft.</p></div><div class="creation-preview-grid"><section class="creation-section"><div class="eyebrow">Ability scores</div><div class="creation-score-grid">${CABILITIES.map(a=>`<div><strong>${scores[a]}</strong><small>${a} · ${cmod(scores[a])}</small></div>`).join('')}</div><div class="creation-stat"><span>HP · AC · Speed</span><strong>${p.max_hp} · ${p.armor_class} · ${p.speed} ft</strong></div><div class="creation-stat"><span>Proficiency</span><strong>+${p.proficiency_bonus}</strong></div></section><section class="creation-section"><div class="eyebrow">Race and class package</div><div class="creation-stat"><span>Race bonuses</span><strong>${esc(cbonus(r.race_bonuses||{}))}</strong></div><div class="creation-stat"><span>Floating</span><strong>${esc((r.floating_bonuses||[]).join(' · ')||'None')}</strong></div><p class="creation-muted">${esc((p.features||[]).join(' · '))}</p><p class="creation-muted">${esc((p.interaction_tags||[]).join(' · '))}</p></section><section class="creation-section"><div class="eyebrow">Skills and spells</div><p>${esc(Object.entries(skills).map(([skill,bonus])=>`${skill} ${bonus>=0?'+':''}${bonus}`).join(' · ')||'No trained skills')}</p>${p.known_spells?.length?`<p class="creation-muted">${esc(p.known_spells.map(x=>x.replace('@5e','')).join(' · '))}</p>`:''}</section><section class="creation-section"><div class="eyebrow">Starting kit</div><p>${esc(equipment.join(' · ')||'No equipment')}</p><p class="creation-muted">Gold ${esc(p.background?.starting_gold)} · origin ${esc(p.origin_item?.name||'—')} · heirloom ${esc(p.heirloom_item?.name||'none')}</p></section></div><details class="creation-receipt"><summary>Show deterministic creation receipt</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details><div class="creation-actions"><button class="primary" data-create-action="confirm">Confirm and begin descent</button><button data-create-action="edit">Edit character</button><button data-create-action="restart">Restart</button></div></section>`}
function room(battle=false){const r=S.view.room||{};return `<div class="content-grid"><section>${stage(battle)}<div class="dialogue"><div class="eyebrow">${battle?'Your next decision':'At the threshold'}</div><h2>${esc(battle?'Stand together.':r.name||r.id||'The Reliquary')}</h2><p>${esc(S.view.narration||r.apparent_function||'Read the room before committing.')}</p></div><div class="actions">${actionButtons()}</div>${S.live?'<form class="intent" id="intent-form"><input name="intent" aria-label="Your action" placeholder="Describe your action…" required maxlength="1000"><button class="primary">Send action</button></form>':''}</section><aside class="stack"><section class="panel"><div class="eyebrow">Your party</div>${actors()}<div class="rule"></div><small>${S.live?'Public party status':'Illustrative party · design fixture'}</small></section><section class="panel"><div class="eyebrow">${battle?'Visible opposition':'Journey'}</div>${battle?(S.view.opposition||[]).map(e=>`<div class="row"><span>${esc(e.name)}</span><small>${esc(e.hp)} HP</small></div>`).join('')||'<p class="muted">No opposition reported by the host. The encounter frame remains available for layout verification.</p>':stats()}<div class="rule"></div><small>${battle?'Round '+esc(S.view.round):'Rooms cleared · '+esc(S.view.progression?.rooms_cleared)}</small></section></aside></div>`}
function equipment(){const a=actor(),gear=Array.isArray(a.equipment)?a.equipment:Object.entries(a.equipment||{}).map(([slot,name])=>({slot,name:typeof name==='string'?name:JSON.stringify(name)}));return `<div class="split"><section class="panel"><div class="eyebrow">Selected adventurer</div>${actors()}</section><section class="panel"><div class="eyebrow">Field loadout</div><h2>${esc(a.name)}</h2><p class="muted">Equipment, carried objects, and earned loot</p><div class="cards" style="margin-top:22px">${gear.map((g,i)=>`<button class="panel" data-gear="${i}"><span class="inventory-icon">♜</span><h3>${esc(typeof g==='string'?g:g.name||g.id)}</h3><small>${esc(g.slot||'Equipment')} · Inspect</small></button>`).join('')||'<p class="muted">No public equipment listed for this actor.</p>'}</div><div class="rule"></div><div class="eyebrow">Pack and loot</div>${(S.view.inventory||[]).map((g,i)=>`<button style="margin:12px 8px 0 0" data-item="${i}">◇ ${esc(g.name||g.id)}</button>`).join('')||'<p class="muted">No public inventory items. Loot appears here after the host resolves a search.</p>'}<p class="muted" style="margin-top:18px">Inspecting an item does not equip or consume it. Loot is narrated with location and condition before its mechanics are shown.</p></section></div>`}
function roster(){const a=actor();return `${!S.live?artControls():''}<div class="split"><section class="panel"><div class="eyebrow">Party roster</div>${actors()}</section><section class="panel"><div class="split"><div class="portrait-stage">${S.live?'<span class="portrait" style="width:110px;height:140px;font-size:65px">'+esc(a.name?.[0])+'</span>':avatar(S.artRole,S.weapon)}</div><div><div class="eyebrow">${S.live?'Host party member':'Illustrative role study'}</div><h2>${esc(a.name)}</h2><div class="row"><span>Health</span><strong>${esc(a.hp)} / ${esc(a.max_hp)}</strong></div><div class="row"><span>Armor class</span><strong>${esc(a.armor_class)}</strong></div><div class="row"><span>Status</span><strong>${esc(Array.isArray(a.status)?a.status.join(', ')||'None reported':a.status||'None reported')}</strong></div><div class="row"><span>Position</span><strong>${esc(a.position==null?'Not reported':JSON.stringify(a.position))}</strong></div><p class="muted" style="margin-top:20px">Character creation and signature kit rules remain in the existing character workshop.</p><button data-screen="equipment" style="margin-top:15px">View equipment →</button></div></div></section></div>`}
function journal(){const p=S.view.progression||{},events=S.view.recent_receipts||[];return `<div class="content-grid"><section class="panel"><div class="eyebrow">Public record</div><h2>Journey journal</h2>${events.length?events.map(e=>`<div class="log-item">${esc(e.message||e.outcome||e.type||JSON.stringify(e))}</div>`).join(''):'<p class="muted" style="margin-top:22px">No resolved events yet. Host-returned receipts will appear here after an action resolves.</p>'}${S.receipt?'<details style="margin-top:20px"><summary>Latest public receipt</summary><pre>'+esc(JSON.stringify(S.receipt,null,2))+'</pre></details>':''}</section><section class="panel"><div class="eyebrow">Progression</div>${stats()}<div class="row"><span>Rank XP</span><strong>${esc(p.rank_xp)}</strong></div><div class="row"><span>Rooms cleared</span><strong>${esc(p.rooms_cleared)}</strong></div><p class="muted" style="margin-top:15px">${S.live?'Only values exposed in this readout are shown.':'Illustrative values from the design fixture.'}</p></section></div>`}
function map(){return `<section class="panel"><div class="eyebrow">Public design atlas</div><h2>Five floors. One descent.</h2><p class="muted" style="margin-top:12px">Floor identities from the documented blueprint. This is not a discovered route map.</p><div class="floor-list">${['The Town Above the Well','The Machine Works','The Three Dragons','The Sunless Sea','The Opulent Palace and Cocoon'].map((x,i)=>`<div class="floor"><span>0${i+1}</span><div><h3>${x}</h3><small>Public blueprint · routes revealed through play</small></div></div>`).join('')}</div></section>`}
function options(){return `<section class="panel" style="max-width:680px"><div class="eyebrow">Make yourself comfortable</div><h2>Display options</h2><label>Motion<select id="motion"><option value="full">Gentle idle motion</option><option value="reduced">Reduced motion</option></select></label><label>Text size<select id="text-size"><option value="1">Standard</option><option value="1.15">Large</option><option value="1.3">Extra large</option></select></label><label>Effects<select id="effects"><option value="full">Full color</option><option value="soft">Soft color</option></select></label><p class="muted">Display preferences are saved on this browser. Your system's reduced-motion preference is always respected.</p><div class="rule"></div><div class="eyebrow">Future run modes</div><div class="row"><span>Idle preparation</span><strong class="muted">Coming later</strong></div><div class="row"><span>Auto battle</span><strong class="muted">Coming later</strong></div><div class="row"><span>Simulation rehearsal</span><strong class="muted">Separate test mode</strong></div><p class="muted">Simulation-only controls for absurd cases will stay out of ordinary runs.</p><div class="rule"></div><button data-home>Title screen</button></section>`}
function title(){return `<section class="entry"><div><div class="eyebrow">A Hollow Star interface study</div><h2>Hollow Star<br><span style="color:var(--gold)">Reliquary</span></h2><p class="muted">A town above. An unknown world below.</p><div class="actions"><button class="primary" data-screen="create">Create a lead</button><button data-screen="room">Open design fixture</button><button data-connect>Connect local engine</button><button data-screen="options">Options</button></div><small style="display:block;margin-top:25px">2D anime-inspired art · existing HSR runtime</small></div></section>`}
function render(){const content=S.screen==='title'?title():S.screen==='room'?room():S.screen==='battle'?room(true):S.screen==='equipment'?equipment():S.screen==='roster'?roster():S.screen==='residents'?residents():S.screen==='journal'?journal():S.screen==='map'?map():options();$('#app').innerHTML=`<header><div class="brand"><span class="mark">✧</span><div><div class="eyebrow">The descent awaits</div><h1>Hollow Star Reliquary</h1></div></div><div class="header-controls"><span class="badge">${S.live?'ENGINE CONNECTED':'DESIGN FIXTURE'}</span>${S.live?'<button data-refresh>Refresh</button><button data-save>Save run</button>':'<button data-connect>Connect engine</button>'}</div></header><div class="layout"><nav aria-label="Game screens">${tabs.map(([id,icon,label])=>`<button data-screen="${id}" class="${S.screen===id?'active':''}" aria-current="${S.screen===id?'page':'false'}"><b aria-hidden="true">${icon}</b>${label}</button>`).join('')}</nav><main class="workspace"><div class="topline"><div><div class="eyebrow">${S.live?esc(S.runId):'DESIGN FIXTURE · NO RUN LOADED'}</div><h2>${esc(tabs.find(t=>t[0]===S.screen)?.[2]||'Welcome')}</h2></div><small>${S.busy?'Waiting for the engine…':S.live?'Actions save through the local host':'Local illustration; no save data changed'}</small></div>${content}<div class="notice" role="status">${esc(S.note||'')}</div><div class="bottom"><span>HOLLOW STAR / 2D PRESENTATION WORKSHOP</span><span>${S.live?'Host public view':'Illustrative fixture · source: ui-design-system.json'} · Keyboard & touch ready</span></div></main></div>`;bind();if(S.busy)document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true)}
function modal(title,body){const d=$('#modal');d.innerHTML=`<button class="close" aria-label="Close dialog">×</button><h2>${esc(title)}</h2>${body}`;d.querySelector('.close').onclick=()=>d.close();d.showModal()}
async function host(command,fields={}){const r=await fetch('/api/host',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),command,public_only:true,...fields})});if(!r.ok)throw Error('Engine request failed ('+r.status+').');const p=await r.json();if(!p.ok)throw Error(p.error?.message||p.message||p.error?.code||p.code||'Host rejected request');if(p.settled_error)throw Error('The final NPC state could not be refreshed. Use Refresh before another action.');return p.v==='hollow-star-transfer-capsule-1'?{readout:{run_id:p.run,public_view:p.view,public_receipt:p.receipt||p.event}}:p.result}
async function work(fn){if(S.busy)return;S.busy=true;render();try{await fn()}catch(e){S.note=e.message+' Your last displayed state is retained. Refresh before retrying an uncertain action.'}finally{S.busy=false;render()}}
function accept(result){const x=result.readout||result.turn;if(x?.public_view?.schema!=='hollow-star-public-view-1')throw Error('No public view in the host response.');S.view=x.public_view;S.receipt=x.public_receipt;S.live=true;S.runId=x.run_id||S.view.run_id||S.runId;S.note='Public state refreshed.'}
async function readout(){accept(await host('readout',{run_id:S.runId,public_only:true}))}
function connect(){if(location.protocol==='file:'||location.port==='8876'){modal('Open through the local launcher','<p>Run <strong>hsr_web_server.bat</strong> in the HSR folder, then open this same mockup through the local server.</p><p><a href="http://127.0.0.1:8765/hsr-ui-mockup.html">Open local engine interface →</a></p><p>The design fixture remains available without connecting. The engine interface runs on port 8765.</p>');return}work(async()=>{await host('boot',{mode:'DESIGN'});const x=await host('list_runs');const runs=x.runs||[];modal('Choose a saved DESIGN run',`<p>Choose explicitly which run to load. Runs from other modes will be rejected by the host.</p>${runs.length?'<label>Saved run<select id="run-picker">'+runs.map(r=>{const id=typeof r==='string'?r:r.run_id;return `<option value="${esc(id)}">${esc(id)}</option>`}).join('')+'</select></label><button class="primary" id="load-run">Load selected run</button>':'<p>No saved runs. Create a run in the existing terminal workshop, then reconnect.</p>'}`);$('#load-run')?.addEventListener('click',()=>{const id=$('#run-picker').value;$('#modal').close();work(async()=>{await host('load_run',{run_id:id});const result=await host('readout',{run_id:id,public_only:true});accept(result);S.screen='room'})})})}
function action(index){const a=S.view.available_actions[index],id=typeof a==='string'?a:a.id||a.type,label=a.label||id;if(!S.live){modal(label+' · engine required','<p>This control becomes actionable after a DESIGN run is loaded. The host determines legality, rolls, resources, and consequences.</p><p>The design fixture does not simulate a result.</p>');return}const input=$('#intent-form input');input.value=label+' ';input.focus();S.note='Complete the action with a target or destination if needed, then send.';$('.notice').textContent=S.note}
function bind(){$('#art-role')?.addEventListener('change',e=>{S.artRole=e.target.value;render()});$('#art-weapon')?.addEventListener('change',e=>{S.weapon=e.target.value;render()});document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{S.screen=b.dataset.screen;render()});document.querySelectorAll('[data-actor]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.actor;render()});document.querySelectorAll('[data-connect]').forEach(b=>b.onclick=connect);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(Number(b.dataset.action)));document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const g=actor().equipment;const item=Array.isArray(g)?g[b.dataset.gear]:Object.entries(g||{})[b.dataset.gear];modal('Equipment details','<pre>'+esc(JSON.stringify(item,null,2))+'</pre>')});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>modal('Inventory details','<pre>'+esc(JSON.stringify(S.view.inventory[b.dataset.item],null,2))+'</pre>'));$('[data-refresh]')?.addEventListener('click',()=>work(readout));$('[data-save]')?.addEventListener('click',()=>work(async()=>{await host('save_run',{run_id:S.runId});S.note='Run saved by the host.'}));$('#intent-form')?.addEventListener('submit',e=>{e.preventDefault();const intent=new FormData(e.target).get('intent').trim();if(!intent)return;work(async()=>{accept(await host('design_turn',{run_id:S.runId,intent,public_only:true}));S.note='Action resolved by the host.'})});$('[data-home]')?.addEventListener('click',()=>{S.screen='title';render()});if($('#motion')){$('#motion').value=document.body.classList.contains('reduced')?'reduced':'full';$('#motion').onchange=e=>document.body.classList.toggle('reduced',e.target.value==='reduced');$('#text-size').value=document.documentElement.style.getPropertyValue('--scale')||'1';$('#text-size').onchange=e=>document.documentElement.style.setProperty('--scale',e.target.value);$('#effects').value=document.body.classList.contains('soft')?'soft':'full';$('#effects').onchange=e=>document.body.classList.toggle('soft',e.target.value==='soft')}}
async function loadCreator(){
  if(S.options)return;
  if(location.protocol==='file:'||location.port==='8876'){
    modal('Open through the local launcher','<p>Run <strong>hsr_web_server.bat</strong> in the HSR folder, then open this same mockup through the local server.</p><p><a href="http://127.0.0.1:8765/hsr-ui-mockup.html">Open local engine interface →</a></p>');
    return;
  }
  await work(async()=>{
    await host('boot',{mode:'DESIGN'});
    S.options=await host('character_options');
    S.note='Host registry loaded. Choose an ancestry, class, and origin, then preview before saving.';
  });
}
function resetCreator(){S.draft={...S.draft,name:'',identity:'',creation_seed:'',level:1,roll_set:0,ability_assignment:'auto',floating_bonuses:'auto',advancements:'auto',advancement_mode:'auto',skills:'auto',skill_mode:'auto',spells:'auto',spell_mode:'auto',spell_budget:0};S.roll=null;S.preview=null;S.createStep='edit';S.note='Character draft reset. Nothing was saved.';render()}
function creationRender(){return S.screen==='create'?creator():''}
function render(){
  const content=S.screen==='title'?title():S.screen==='room'?room():S.screen==='battle'?room(true):S.screen==='equipment'?equipment():S.screen==='roster'?roster():S.screen==='residents'?residents():S.screen==='journal'?journal():S.screen==='map'?map():S.screen==='create'?creationRender():options();
  $('#app').innerHTML=`<header><div class="brand"><span class="mark">✧</span><div><div class="eyebrow">The descent awaits</div><h1>Hollow Star Reliquary</h1></div></div><div class="header-controls"><span class="badge">${S.live?'ENGINE CONNECTED':'DESIGN FIXTURE'}</span>${S.live?'<button data-refresh>Refresh</button><button data-save>Save run</button>':'<button data-connect>Connect engine</button>'}</div></header><div class="layout"><nav aria-label="Game screens">${tabs.map(([id,icon,label])=>`<button data-screen="${id}" class="${S.screen===id?'active':''}" aria-current="${S.screen===id?'page':'false'}"><b aria-hidden="true">${icon}</b>${label}</button>`).join('')}</nav><main class="workspace"><div class="topline"><div><div class="eyebrow">${S.live?esc(S.runId):'DESIGN FIXTURE · NO RUN LOADED'}</div><h2>${esc(tabs.find(t=>t[0]===S.screen)?.[2]||'Welcome')}</h2></div><small>${S.busy?'Waiting for the engine…':S.live?'Actions save through the local host':'Local illustration; no save data changed'}</small></div>${content}<div class="notice" role="status">${esc(S.note||'')}</div><div class="bottom"><span>HOLLOW STAR / 2D PRESENTATION WORKSHOP</span><span>${S.live?'Host public view':'Illustrative fixture · source: ui-design-system.json'} · Keyboard & touch ready</span></div></main></div>`;
  bind();
  if(S.busy)document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);
}
function bind(){
  $('#art-role')?.addEventListener('change',e=>{S.artRole=e.target.value;render()});
  $('#art-weapon')?.addEventListener('change',e=>{S.weapon=e.target.value;render()});
  document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.screen;
    if(id==='create'){
      S.screen='create';S.createStep='edit';render();
      if(!S.options)loadCreator();
      return;
    }
    S.screen=id;render();
  });
  document.querySelectorAll('[data-actor]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.actor;render()});
  document.querySelectorAll('[data-connect]').forEach(b=>b.onclick=connect);
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(Number(b.dataset.action)));
  document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const g=actor().equipment;const item=Array.isArray(g)?g[b.dataset.gear]:Object.entries(g||{})[b.dataset.gear];modal('Equipment details','<pre>'+esc(JSON.stringify(item,null,2))+'</pre>')});
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>modal('Inventory details','<pre>'+esc(JSON.stringify(S.view.inventory[b.dataset.item],null,2))+'</pre>'));
  $('[data-refresh]')?.addEventListener('click',()=>work(readout));
  $('[data-save]')?.addEventListener('click',()=>work(async()=>{await host('save_run',{run_id:S.runId});S.note='Run saved by the host.'}));
  $('#intent-form')?.addEventListener('submit',e=>{e.preventDefault();const intent=new FormData(e.target).get('intent').trim();if(!intent)return;work(async()=>{accept(await host('design_turn',{run_id:S.runId,intent,public_only:true}));S.note='Action resolved by the host.'})});
  $('[data-home]')?.addEventListener('click',()=>{S.screen='title';render()});
  document.querySelectorAll('[data-create]').forEach(node=>node.onchange=()=>{
    const key=node.dataset.create;
    S.draft[key]=['level','spell_budget'].includes(key)?Number(node.value):node.value;
    if(key==='creation_seed'&&node.value)S.draft.creation_seed=node.value;
    if(key==='character_class'&&!((copt('classes',node.value).spells||[]).length))S.draft.spell_budget=0;
    if(key==='race')S.draft.floating_bonuses='auto';
    if(key==='character_class')S.draft.spells='auto';
    render();
  });
  document.querySelectorAll('[data-assign]').forEach(node=>node.onchange=()=>{
    const next=S.draft.ability_assignment&&typeof S.draft.ability_assignment==='object'?{...S.draft.ability_assignment}:cauto(S.roll?.scores||[],copt('classes',S.draft.character_class));
    document.querySelectorAll('[data-assign]').forEach(select=>{if(select.value)next[select.dataset.assign]=Number(select.value)});
    S.draft.ability_assignment=Object.keys(next).length===CABILITIES.length?next:'auto';render();
  });
  document.querySelectorAll('[data-floating]').forEach(node=>node.onchange=()=>{S.draft.floating_bonuses=[...document.querySelectorAll('[data-floating]:checked')].map(input=>input.dataset.floating);if(!S.draft.floating_bonuses.length)S.draft.floating_bonuses='auto';render()});
  document.querySelectorAll('[data-advancement]').forEach(node=>node.onchange=()=>{S.draft.advancements={...(S.draft.advancements&&typeof S.draft.advancements==='object'?S.draft.advancements:{}),[node.dataset.advancement]:Number(node.value||0)};render()});
  document.querySelectorAll('[data-skill]').forEach(node=>node.onchange=()=>{S.draft.skills=[...document.querySelectorAll('[data-skill]:checked')].map(input=>input.dataset.skill);render()});
  document.querySelectorAll('[data-spell]').forEach(node=>node.onchange=()=>{S.draft.spells=[...document.querySelectorAll('[data-spell]:checked')].map(input=>input.dataset.spell);render()});
  document.querySelectorAll('[data-create-action]').forEach(node=>node.onclick=async()=>{
    const action=node.dataset.createAction;
    if(action==='load')return loadCreator();
    if(action==='restart')return resetCreator();
    if(action==='edit'){S.createStep='edit';S.preview=null;return render()}
    if(action==='advancements-manual'){S.draft.advancement_mode='manual';S.draft.advancements={};return render()}
    if(action==='advancements-auto'){S.draft.advancement_mode='auto';S.draft.advancements='auto';return render()}
    if(action==='skills-manual'){S.draft.skill_mode='manual';S.draft.skills=[];return render()}
    if(action==='skills-auto'){S.draft.skill_mode='auto';S.draft.skills='auto';return render()}
    if(action==='spells-manual'){S.draft.spell_mode='manual';S.draft.spells=[];return render()}
    if(action==='spells-auto'){S.draft.spell_mode='auto';S.draft.spells='auto';return render()}
    if(action==='roll')return work(async()=>{
      const seed=S.draft.creation_seed||S.draft.name;
      if(!seed)throw Error('Enter a lead name or creation seed before rolling ability scores.');
      const nextSet=S.roll?1:0;
      if(S.roll?.roll_set===1)throw Error('The single ability-score reroll has already been used.');
      S.draft.creation_seed=seed;S.draft.roll_set=nextSet;
      const reply=await host('character_roll',{creation_seed:seed,roll_set:nextSet});
      S.roll=reply.ability_roll||reply.result?.ability_roll||null;S.draft.ability_assignment='auto';S.note=nextSet?'Rerolled ability scores. The first set remains in the host receipt.':'Ability scores rolled. Assign them or keep automatic placement.';
    });
    if(action==='confirm')return work(async()=>{
      const profileSeed=S.draft.identity||S.draft.creation_seed||S.draft.name;
      const profileId=`web-${profileSeed.toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-|-$/g,'')||Date.now()}`;
      const build=cbuild();
      await host('build_character',{profile_id:profileId,build,expected_build_hash:S.preview.character.build_hash});
      const runId=`${profileId}-${Date.now().toString(36)}`;
      await host('create_run',{run_id:runId,seed:S.draft.creation_seed||S.draft.name,party:[`custom:${profileId}`],lead_selector:`custom:${profileId}`,opposition:['Townsperson']});
      await host('design_start',{run_id:runId});
      S.runId=runId;await readout();S.screen='room';S.createStep='edit';S.note='Character confirmed. The new DESIGN run is ready.';
    });
  });
  $('#creation-form')?.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));S.draft={...S.draft,...data,level:Number(data.level||S.draft.level||1),spell_budget:Number(data.spell_budget||S.draft.spell_budget||0)};if(!S.draft.creation_seed)S.draft.creation_seed=S.draft.name;work(async()=>{S.preview=await host('preview_character',{build:cbuild()});S.createStep='preview';S.note='Host returned a deterministic preview. Confirm only when the sheet looks right.'})});
  if($('#motion')){$('#motion').value=document.body.classList.contains('reduced')?'reduced':'full';$('#motion').onchange=e=>document.body.classList.toggle('reduced',e.target.value==='reduced');$('#text-size').value=document.documentElement.style.getPropertyValue('--scale')||'1';$('#text-size').onchange=e=>document.documentElement.style.setProperty('--scale',e.target.value);$('#effects').value=document.body.classList.contains('soft')?'soft':'full';$('#effects').onchange=e=>document.body.classList.toggle('soft',e.target.value==='soft')}
}
render();
</script><script src="web/ui-polish.js"></script></body></html>
